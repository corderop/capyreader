name: Instrumented Tests

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: instrumented-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 31
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-pixel_5
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-load ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot."
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: ./gradlew :app:connectedFreeDebugAndroidTest --build-cache
      - name: Test results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("app/build/outputs/androidTest-results/**/TEST-*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  failures = case.findall("failure") + case.findall("error")
                  print(f"{'FAIL' if failures else 'PASS'} {case.get('classname')}.{case.get('name')}")
                  for failure in failures:
                      print((failure.text or "")[:4000])
          EOF
